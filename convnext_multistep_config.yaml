name: UpperEel_box.wy2003
log_location: /home/ga6/hydrogen-emulator-1ts/runs
model_type: convnext # fixed for now
optimizer: adam # fixed for now
loss: mse # fixed for now
n_epochs: 3 #300  # small for testing
batch_size: 64 # reduced batch size for memory with multi-timestep
lr: 0.001
num_workers: 16
dtype: float64
device: cuda:0
set_seed: true

data_def:
  train_data_location: /scratch/network/ga6/1ts_training/Upper_Eel_box/ #/scratch/network/ga6/1ts_training/New_Ohio_Box/Ohio_box/no_emulator/
  #validation_data_location: /scratch/network/reedmm/1ts_training/Upper_Eel_box/
  test_data_location: /scratch/network/ga6/1ts_training/Upper_Eel_box/ #/scratch/network/ga6/1ts_training/New_Ohio_Box/Ohio_box/no_emulator/
  parameters:
    - [alpha, 0]
    - [n, 0]
    - [slope_x, 0]
    - [slope_y, 0]
    - [perm_x, 0]
    - [perm_y, 0]
    - [perm_z, 0]
    - [porosity, 0]
    - [mannings, 0]
    - [specific_storage, 0]
    - [sres, 0]
    - [ssat, 0]
  patch_size_x: 64 #72 #100
  patch_size_y: 62 #86 #100
  overlap_x: 0
  overlap_y: 0
  n_evaptrans: 5
  n_timesteps: 24  # Predict 3 timesteps ahead (t+1, t+2, t+3)
  shuffle: False

model_def:
  in_channels: 108 # Number of input channels from state_data
  out_channels: 10 # Number of output channels (depth layers)
  kernel_size: 3 # Kernel size for the convolutional layers
  bottleneck_dim: 48
  hidden_dim: 96 # Number of filters in the convolutional layers
  depth: 1 # Number of resnet blocks

# Multi-timestep autoregressive training configuration
autoregressive:
  # Optional: Custom loss weights for each timestep
  # If not specified, equal weighting is used
  # Example: [1.0, 0.8, 0.6] - decreasing weight for later timesteps
  # loss_weights: [1.0, 0.8, 0.6]

tensorboard:
  enabled: true
  log_hyperparams: true
  log_model_graph: true
  log_images: true
  log_frequency: 5  # Log images every 5 epochs
  max_images: 3

callbacks:
  # Early stopping
  early_stopping:
    enabled: false
    monitor: 'val_loss'
    patience: 15
    min_delta: 1e-6
    mode: 'min'
    restore_best_weights: true

  # Model checkpointing
  model_checkpoint:
    enabled: false
    monitor: 'val_loss'
    save_best_only: true
    save_weights_only: false
    mode: 'min'
    save_top_k: 3
    verbose: true

  # Learning rate scheduling
  lr_scheduler:
    enabled: true
    type: 'ReduceLROnPlateau'
    mode: 'min'
    factor: 0.6
    patience: 5
    min_lr: 1e-7
    verbose: true

  # Gradient clipping
  gradient_clipping:
    enabled: true
    max_norm: 1.0
    norm_type: 2.0
